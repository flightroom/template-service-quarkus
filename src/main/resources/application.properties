quarkus.application.name=%serviceSlug%

# HTTP
quarkus.http.port=${PORT:8080}

# Graceful shutdown on SIGTERM: readiness reports DOWN for the delay so Kubernetes stops routing traffic,
# then in-flight requests get up to the timeout to finish
quarkus.shutdown.delay-enabled=true
quarkus.shutdown.delay=${SHUTDOWN_DELAY:2s}
quarkus.shutdown.timeout=${SHUTDOWN_TIMEOUT:20s}
%dev,test.quarkus.shutdown.delay=0s

# OpenAPI + Swagger UI: public, also in the production image
quarkus.smallrye-openapi.info-title=%serviceSlug%
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.swagger-ui.always-include=true
